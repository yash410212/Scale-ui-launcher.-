name: Build Android APK

on:
  workflow_dispatch:

  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Scale UI APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:

      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Find and extract ZIP automatically
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project ZIP..."

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            ! -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Detecting Gradle project..."

          PROJECT_ROOT="$(find extracted -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No Gradle project found inside ZIP."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          rm -rf workspace
          mkdir -p workspace

          cp -a "$PROJECT_ROOT/." workspace/

          echo "Project extracted successfully."

          echo "Project files:"
          ls -la workspace


      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # 5. Install required Android SDK packages
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # 6. Gradle 8.6
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"


      # 7. Check environment
      - name: Check build environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E \
            "platforms;android-34|build-tools;34.0.0" || true


      # 8. Build APK
      - name: Build Debug APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon


      # 9. Verify APK
      - name: Verify APK
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: $APK"

          ls -lh "$APK"


      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScaleUI-debug-apk
          path: workspace/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
